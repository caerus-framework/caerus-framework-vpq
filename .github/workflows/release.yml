name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer tag to release (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: caerus-framework/caerus-framework/.github/workflows/go-module-release.yml@main
    with:
      module: caerus-framework-vpq
      deps: "caerus-framework caerus-framework-logs caerus-framework-valkey caerus-framework-configuration"
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      valkey: true
